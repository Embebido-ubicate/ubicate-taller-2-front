<div *ngIf="isOpen" class="fixed inset-0 z-40" style="background-color: rgba(0, 0, 0, 0.4);" (click)="closeModal()">
</div>
<div *ngIf="isOpen" class="fixed inset-0 z-50 flex items-center justify-center " >
  <div class="p-5 border w-96 shadow-lg rounded-md bg-white">
    <div class="mt-3">
      <!-- Header -->
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-lg font-medium text-gray-900">
          {{ isEdit ? 'Editar Bus' : 'Nuevo Bus' }}
        </h3>
        <button (click)="closeModal()" class="text-gray-400 hover:text-gray-600">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>
      </div>

      <!-- Form -->
      <form [formGroup]="busForm" (ngSubmit)="onSubmit()">
        <div class="space-y-4">
          <!-- Placa -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Placa</label>
            <input type="text" formControlName="placa"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
              placeholder="Ej: STR-25">
            <div *ngIf="busForm.get('placa')?.invalid && busForm.get('placa')?.touched"
              class="text-red-500 text-sm mt-1">
              La placa es requerida
            </div>
          </div>

          <!-- Modelo -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Modelo</label>
            <input type="text" formControlName="modelo"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
              placeholder="Ej: Bus..">
            <div *ngIf="busForm.get('modelo')?.invalid && busForm.get('modelo')?.touched"
              class="text-red-500 text-sm mt-1">
              El modelo es requerido
            </div>
          </div>

          <!-- Capacidad -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Capacidad</label>
            <input type="number" formControlName="capacidad"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
              placeholder="Ej: 25">
            <div *ngIf="busForm.get('capacidad')?.invalid && busForm.get('capacidad')?.touched"
              class="text-red-500 text-sm mt-1">
              La capacidad es requerida y debe ser mayor a 0
            </div>
          </div>

          <!-- Año -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Año</label>
            <input type="text" formControlName="anio"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
              placeholder="Ej: 2023">
            <div *ngIf="busForm.get('anio')?.invalid && busForm.get('anio')?.touched" class="text-red-500 text-sm mt-1">
              El año es requerido
            </div>
          </div>

          <!-- Color -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Color</label>
            <input type="text" formControlName="color"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
              placeholder="Ej: Azul">
            <div *ngIf="busForm.get('color')?.invalid && busForm.get('color')?.touched"
              class="text-red-500 text-sm mt-1">
              El color es requerido
            </div>
          </div>
        </div>

        <!-- Buttons -->
        <div class="flex justify-end space-x-3 mt-6">
          <button type="button" (click)="closeModal()"
            class="px-4 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50">
            Cancelar
          </button>
          <button type="submit" [disabled]="busForm.invalid || loading"
            class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed flex items-center">
            <svg *ngIf="loading" class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor"
                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
              </path>
            </svg>
            {{ loading ? 'Guardando...' : (isEdit ? 'Actualizar' : 'Crear') }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
