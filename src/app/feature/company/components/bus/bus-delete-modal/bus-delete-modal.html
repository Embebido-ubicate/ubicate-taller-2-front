<div *ngIf="isOpen" class="fixed inset-0 z-40" style="background-color: rgba(0, 0, 0, 0.4);" (click)="closeModal()">
</div>
<div *ngIf="isOpen" class="fixed inset-0 flex items-center justify-center z-50" (click)="closeModal()">
  <div class="p-5 border w-96 shadow-lg rounded-md bg-white" (click)="$event.stopPropagation()">

    <div class="mt-3 text-center">
      <div class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-red-100">
        <svg class="h-6 w-6 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L3.732 16c-.77.833.192 2.5 1.732 2.5z" />
        </svg>
      </div>

      <!-- Title -->
      <h3 class="text-lg font-medium text-gray-900 mt-4">Eliminar Bus</h3>

      <!-- Message -->
      <div class="mt-2 px-7 py-3">
        <p class="text-sm text-gray-500">
          ¿Estás seguro de que deseas eliminar el bus <strong>{{ bus?.placa }}</strong>?
          Esta acción no se puede deshacer.
        </p>
        <div *ngIf="bus" class="mt-3 p-3 bg-gray-50 rounded-lg text-left">
          <div class="text-xs text-gray-600">
            <div><strong>Modelo:</strong> {{ bus.modelo }}</div>
            <div><strong>Año:</strong> {{ bus.anio }}</div>
            <div><strong>Capacidad:</strong> {{ bus.capacidad }} pasajeros</div>
          </div>
        </div>
      </div>

      <!-- Buttons -->
      <div class="flex justify-center space-x-3 mt-4">
        <button (click)="closeModal()" [disabled]="isDeleting"
          class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed">
          Cancelar
        </button>
        <button (click)="confirmDelete()" [disabled]="isDeleting"
          class="px-4 py-2 text-sm font-medium text-white bg-red-600 border border-transparent rounded-lg hover:bg-red-700 disabled:opacity-50 disabled:cursor-not-allowed">
          <span *ngIf="isDeleting" class="inline-flex items-center">
            <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none"
              viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor"
                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
              </path>
            </svg>
            Eliminando...
          </span>
          <span *ngIf="!isDeleting">Eliminar</span>
        </button>
      </div>
    </div>
  </div>
</div>
