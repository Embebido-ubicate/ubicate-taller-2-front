<!-- Bus Filters Component -->
<div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6 mb-6">
  <div class="grid grid-cols-1 md:grid-cols-4 gap-4">

    <!-- Búsqueda -->
    <div class="md:col-span-2">
      <label class="block text-sm font-medium text-gray-700 mb-2">Buscar</label>
      <div class="relative">
        <input type="text" placeholder="Buscar por placa, modelo o conductor..."
          class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
        <svg class="absolute left-3 top-2.5 w-5 h-5 text-gray-400" fill="none" stroke="currentColor"
          viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="m21 21-6-6m2-5a7 7 0 1 1-14 0 7 7 0 0 1 14 0z" />
        </svg>
      </div>
    </div>

    <!-- Estado -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">Estado</label>
      <select
        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
        <option value="">Todos</option>
        <option value="activo">Activo</option>
        <option value="en_ruta">En Ruta</option>
        <option value="mantenimiento">Mantenimiento</option>
        <option value="inactivo">Inactivo</option>
      </select>
    </div>

    <!-- Ruta -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">Ruta</label>
      <select
        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
        <option value="">Todas</option>
        <option value="ruta_a">Ruta A</option>
        <option value="ruta_b">Ruta B</option>
        <option value="ruta_c">Ruta C</option>
      </select>
    </div>

  </div>
</div>
