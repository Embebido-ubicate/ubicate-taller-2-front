<div class="flex justify-between items-center mb-8">
  <div>
    <h1 class="text-3xl font-bold text-gray-900">Gestión de Buses</h1>
    <p class="text-gray-600 mt-2">Administra tu flota de buses</p>
  </div>
  <button (click)="openCreateModal()"
    class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-6 py-3 rounded-lg transition-colors duration-200 flex items-center gap-2 shadow-sm hover:shadow-md">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
    </svg>
    Nuevo Bus
  </button>
</div>

<app-bus-create [isOpen]="showCreateModal" [bus]="null" (onClose)="closeCreateModal()" (onSave)="onBusCreated()">
</app-bus-create>
