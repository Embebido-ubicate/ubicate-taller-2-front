
<div *ngIf="isVisible" class="fixed inset-0 overflow-y-auto h-full w-full z-50 flex items-center justify-center p-4">
  <div class="bg-white w-full max-w-2xl shadow-2xl rounded-xl border border-gray-200">

    <!-- Header del Modal -->
    <div class="flex justify-between items-center px-8 py-6 border-b border-gray-200">
      <div class="flex items-center">
        <h3 class="text-xl font-semibold text-gray-900">Editar Conductor</h3>
        <span *ngIf="conductor" class="ml-4 text-sm text-gray-600">{{ conductor.nombre_completo }}</span>
      </div>
      <button (click)="cancel()" class="text-gray-400 hover:text-gray-600 transition-colors">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Formulario -->
    <form [formGroup]="conductorForm" (ngSubmit)="onSubmit()" class="px-8 py-6">

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Turno -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Turno</label>
          <select formControlName="turno"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all">
            <option *ngFor="let turno of turnos" [value]="turno.value">{{ turno.label }}</option>
          </select>
        </div>

        <!-- Estado -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Estado</label>
          <select formControlName="estado"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all">
            <option *ngFor="let estado of estados" [value]="estado">{{ estado }}</option>
          </select>
        </div>

        <!-- Años de Experiencia -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Años de Experiencia</label>
          <input type="number" formControlName="experienciaAnios" min="0" max="50"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all">
        </div>
      </div>

      <!-- Observaciones -->
      <div class="mt-6">
        <label class="block text-sm font-medium text-gray-700 mb-2">Observaciones</label>
        <textarea formControlName="observaciones" rows="4" placeholder="Observaciones adicionales sobre el conductor..."
          class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all resize-none"></textarea>
      </div>

      <!-- Botones -->
      <div class="flex justify-end space-x-4 pt-6 border-t border-gray-200 mt-8">
        <button type="button" (click)="cancel()" [disabled]="isSubmitting"
          class="px-6 py-3 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
          Cancelar
        </button>
        <button type="submit" [disabled]="isSubmitting"
          class="px-6 py-3 text-sm font-medium text-white bg-blue-600 border border-transparent rounded-lg hover:bg-blue-700 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
          {{ submitButtonText }}
        </button>
      </div>
    </form>
  </div>
</div>
