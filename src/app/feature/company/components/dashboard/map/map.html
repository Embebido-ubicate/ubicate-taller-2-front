<div #mapContainer
  class="relative w-full h-full bg-gray-900 rounded-xl shadow-xl overflow-hidden border border-gray-200">

  <!-- Header del mapa -->
  <div class="absolute top-0 left-0 right-0 z-10 bg-[#021133] text-white p-3">
    <div class="flex justify-between items-center">
      <h3 class="font-semibold text-sm">🚌 Monitoreo de Flota en Tiempo Real</h3>
      <div class="flex gap-2 text-xs">
        <span class="flex items-center gap-1">
          <div class="w-2 h-2 bg-green-400 rounded-full"></div>
          Activo
        </span>
        <span class="flex items-center gap-1">
          <div class="w-2 h-2 bg-yellow-400 rounded-full"></div>
          Parado
        </span>
        <span class="flex items-center gap-1">
          <div class="w-2 h-2 bg-red-400 rounded-full"></div>
          Offline
        </span>
      </div>
    </div>
  </div>

  <!-- Botón de ubicación actual -->
  <button (click)="getCurrentLocation()" [disabled]="isLocating"
    class="absolute top-16 right-4 z-20 bg-white hover:bg-gray-50 disabled:bg-gray-100 text-gray-700 p-3 rounded-lg shadow-lg border border-gray-200 disabled:cursor-not-allowed">

    <div class="flex items-center gap-2">
      <!-- Spinner de carga -->
      <svg *ngIf="isLocating" class="h-4 w-4 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none"
        viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor"
          d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
        </path>
      </svg>

      <!-- Ícono de ubicación -->
      <svg *ngIf="!isLocating" class="h-4 w-4 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z">
        </path>
      </svg>

      <span class="text-xs font-medium">
        {{ isLocating ? 'Ubicando...' : 'Mi Ubicación' }}
      </span>
    </div>
  </button>

  <!-- Mapa con dimensiones específicas -->
  <google-map [center]="center" [zoom]="zoom" [options]="mapOptions" [width]="mapWidth" [height]="mapHeight">

  </google-map>

  <!-- Stats overlay -->
  <div class="absolute bottom-4 left-4 bg-white/90 backdrop-blur-sm rounded-lg p-3 shadow-lg">
    <div class="text-xs text-gray-600 font-medium">Buses Monitoreados</div>
    <div class="text-xl font-bold text-gray-800">{{buses.length}}</div>
  </div>

  <!-- Info de ubicación actual -->
  <div *ngIf="currentLocation"
    class="absolute bottom-4 right-4 bg-blue-500/90 backdrop-blur-sm text-white rounded-lg p-3 shadow-lg">
    <div class="flex items-center gap-2">
      <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z">
        </path>
      </svg>
      <span class="text-xs font-medium">Ubicación Actual</span>
    </div>
  </div>

</div>
