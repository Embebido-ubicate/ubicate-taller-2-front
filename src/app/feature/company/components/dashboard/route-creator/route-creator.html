<div class="absolute top-16 left-4 z-20 bg-white rounded-lg shadow-xl border border-gray-200 p-4 w-72">
  <div class="flex justify-between items-center mb-3">
    <h4 class="font-semibold text-gray-800">🛣️ Nueva Ruta</h4>
    <button (click)="onCancel()" class="text-gray-500 hover:text-gray-700">
      <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
      </svg>
    </button>
  </div>

  <div class="space-y-3">
    <div>
      <label class="block text-xs font-medium text-gray-700 mb-1">Nombre</label>
      <input [(ngModel)]="routeData.nombre" type="text" placeholder="Ej: Ruta Centro-Norte"
        class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>

    <div>
      <label class="block text-xs font-medium text-gray-700 mb-1">Código</label>
      <input [(ngModel)]="routeData.codigo" type="text" placeholder="Ej: R001"
        class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>

    <div>
      <label class="block text-xs font-medium text-gray-700 mb-1">Color</label>
      <div class="flex gap-2">
        <input [(ngModel)]="routeData.colorHex" (ngModelChange)="onColorChange()" type="color"
          class="w-12 h-8 rounded border border-gray-300">
        <input [(ngModel)]="routeData.colorHex" (ngModelChange)="onColorChange()" type="text"
          class="flex-1 px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
    </div>

    <div class="bg-blue-50 p-3 rounded-md">
      <p class="text-xs text-blue-700">
        📍 Haz clic en el mapa: primero origen, luego destino
      </p>
    </div>

    <div class="flex gap-2">
      <button (click)="onSave()" [disabled]="!isFormValid"
        class="flex-1 bg-blue-600 hover:bg-blue-700 disabled:bg-gray-300 text-white px-4 py-2 rounded-md text-sm font-medium disabled:cursor-not-allowed">
        Guardar Ruta
      </button>
      <button (click)="onClear()"
        class="px-4 py-2 border border-gray-300 text-gray-700 rounded-md text-sm font-medium hover:bg-gray-50">
        Limpiar
      </button>
    </div>

    <div *ngIf="hasDestination" class="mt-3">
      <button (click)="onToggleWaypoints()"
        [class]="isAddingWaypoints ? 'bg-orange-600 hover:bg-orange-700' : 'bg-gray-600 hover:bg-gray-700'"
        class="w-full text-white px-4 py-2 rounded-md text-sm font-medium">
        {{ isAddingWaypoints ? '🔴 Parar de agregar puntos' : '📍 Agregar puntos intermedios' }}
      </button>
    </div>
  </div>
</div>
