<div *ngIf="isCreatingRoute && !hasOrigin"
  class="absolute bottom-20 left-1/2 transform -translate-x-1/2 bg-green-500/90 backdrop-blur-sm text-white rounded-lg p-3 shadow-lg">
  <div class="flex items-center gap-2">
    <span class="text-2xl">📍</span>
    <span class="text-sm font-medium">Haz clic para marcar el ORIGEN</span>
  </div>
</div>

<div *ngIf="isCreatingRoute && hasOrigin && !hasDestination"
  class="absolute bottom-20 left-1/2 transform -translate-x-1/2 bg-red-500/90 backdrop-blur-sm text-white rounded-lg p-3 shadow-lg">
  <div class="flex items-center gap-2">
    <span class="text-2xl">🏁</span>
    <span class="text-sm font-medium">Ahora marca el DESTINO</span>
  </div>
</div>
