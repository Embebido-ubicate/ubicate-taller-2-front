<div *ngIf="isVisible" class="absolute top-16 left-4 bg-white rounded-lg shadow-xl z-20 w-96 max-h-96 overflow-hidden">
  <!-- Header -->
  <div class="bg-[#021133] text-white p-3 flex justify-between items-center">
    <h4 class="font-semibold text-sm">🛣️ Lista de Rutas</h4>
    <div class="flex items-center gap-2">
      <!-- Botón de recarga -->
      <button (click)="loadRoutes()" [disabled]="loading"
        class="p-1 hover:bg-white hover:bg-opacity-20 rounded transition-colors" title="Recargar rutas">
        <svg class="w-4 h-4" [class.animate-spin]="loading" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15">
          </path>
        </svg>
      </button>

      <!-- Botón cerrar -->
      <button (click)="onClose()" class="text-white hover:text-gray-300 transition-colors" aria-label="Cerrar">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>
  </div>

  <!-- Estado de error -->
  <div *ngIf="error" class="p-3 bg-red-50 border-l-4 border-red-400 text-red-700 text-sm">
    {{error}}
  </div>

  <!-- Estado de carga -->
  <div *ngIf="loading" class="p-4 text-center">
    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600 mx-auto"></div>
    <p class="text-sm text-gray-600 mt-2">Cargando rutas...</p>
  </div>

  <!-- Lista de rutas -->
  <div *ngIf="!loading" class="max-h-80 overflow-y-auto">
    <div *ngIf="routes.length === 0" class="p-4 text-center text-gray-500 text-sm">
      No hay rutas disponibles
    </div>

    <div *ngFor="let route of routes; trackBy: trackByRoute" (click)="onSelectRoute(route)"
      class="p-3 border-b border-gray-100 hover:bg-gray-50 cursor-pointer transition-colors"
      [class.opacity-50]="!route.activo">

      <div class="flex items-start justify-between">
        <div class="flex items-start gap-3 flex-1 min-w-0">
          <!-- Color de la ruta -->
          <div [style.background-color]="route.colorHex"
            class="w-4 h-4 rounded border border-gray-300 flex-shrink-0 mt-0.5">
          </div>

          <div class="min-w-0 flex-1">
            <!-- Nombre y código -->
            <div class="flex items-center gap-2 mb-1">
              <div class="font-medium text-gray-900 text-sm truncate">
                {{route.nombre}}
              </div>
              <span class="text-xs bg-gray-100 text-gray-600 px-2 py-0.5 rounded-full flex-shrink-0">
                {{route.codigo}}
              </span>
            </div>

            <!-- Origen y destino -->
            <div class="text-xs text-gray-500 mb-1 truncate">
              {{getOriginDestination(route)}}
            </div>

            <!-- Información adicional -->
            <div class="text-xs text-gray-400 truncate">
              {{getRouteInfo(route)}}
            </div>

            <!-- Fecha de creación -->
            <div class="text-xs text-gray-400 mt-1">
              Creada: {{formatDate(route.fechaCreacion)}}
            </div>
          </div>
        </div>

        <!-- Acciones -->
        <div class="flex flex-col gap-1 ml-2 flex-shrink-0">
          <!-- Estado activo/inactivo -->
          <button (click)="onToggleRoute($event, route)"
            [class]="route.activo ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'"
            class="text-xs px-2 py-1 rounded-full transition-colors">
            {{route.activo ? 'Activa' : 'Inactiva'}}
          </button>

          <!-- Botones de acción -->
          <div class="flex gap-1">
            <button (click)="onEditRoute($event, route)" class="p-1 text-gray-400 hover:text-blue-600 transition-colors"
              title="Editar ruta">
              <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z">
                </path>
              </svg>
            </button>
            <button (click)="onDeleteRoute($event, route)"
              class="p-1 text-gray-400 hover:text-red-600 transition-colors" title="Eliminar ruta">
              <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16">
                </path>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

</div>
