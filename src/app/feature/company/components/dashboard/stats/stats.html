<div class="flex gap-4 w-full" *ngIf="stats">
  <div
    class="flex-1 min-w-36 p-5 bg-white border border-gray-200 rounded-lg text-center shadow-sm hover:shadow-md transition-shadow">
    <div class="text-4xl font-bold text-gray-800 mb-2">{{ stats.total_buses }}</div>
    <div class="text-sm text-gray-600 font-medium">Total Buses</div>
  </div>

  <div
    class="flex-1 min-w-36 p-5 bg-white border border-gray-200 rounded-lg text-center shadow-sm hover:shadow-md transition-shadow">
    <div class="text-4xl font-bold text-gray-800 mb-2">{{ stats.buses_activos }}</div>
    <div class="text-sm text-gray-600 font-medium">Activos</div>
  </div>

  <div
    class="flex-1 min-w-36 p-5 bg-white border border-gray-200 rounded-lg text-center shadow-sm hover:shadow-md transition-shadow">
    <div class="text-4xl font-bold text-gray-800 mb-2">{{ stats.buses_inactivos }}</div>
    <div class="text-sm text-gray-600 font-medium">Inactivos</div>
  </div>

  <div
    class="flex-1 min-w-36 p-5 bg-white border border-gray-200 rounded-lg text-center shadow-sm hover:shadow-md transition-shadow">
    <div class="text-4xl font-bold text-gray-800 mb-2">{{ stats.buses_en_mantenimiento }}</div>
    <div class="text-sm text-gray-600 font-medium">Mantenimiento</div>
  </div>

</div>
