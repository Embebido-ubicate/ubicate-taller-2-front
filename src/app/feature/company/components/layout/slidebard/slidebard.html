<div
  class="fixed top-0 left-0 h-screen bg-gradient-to-b from-[#040E1C] to-[#021133] shadow-xl z-40 transition-all duration-300"
  [ngClass]="isOpen ? 'w-64' : 'w-16'">

  <div class="flex flex-col h-full">

    <!-- Company Header -->
    <div class="p-4 border-b border-white/10" *ngIf="isOpen">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-lg bg-white/10 flex items-center justify-center">
          <span class="text-white font-bold text-lg">M</span>
        </div>
        <div>
          <h3 class="text-slate-100 font-semibold">Mi Empresa</h3>
          <p class="text-slate-400 text-sm">20123456789</p>
        </div>
      </div>
    </div>

    <!-- Company Header Collapsed -->
    <div class="p-4 border-b border-white/10" *ngIf="!isOpen">
      <div class="w-8 h-8 rounded-lg bg-white/10 flex items-center justify-center mx-auto">
        <span class="text-white font-bold">M</span>
      </div>
    </div>

    <!-- Navigation Menu -->
    <div class="flex-1 overflow-y-auto p-2">
      <nav class="space-y-1">
        <div *ngFor="let item of menuItems; trackBy: trackByFn">
          <button (click)="onItemClick(item.id)"
            class="w-full flex items-center px-3 py-3 text-sm font-medium rounded-lg transition-all duration-200"
            [ngClass]="{
              'bg-white/10 text-slate-100 shadow-inner ring-1 ring-white/10': activeItem === item.id,
              'text-slate-300 hover:bg-white/5 hover:text-slate-100': activeItem !== item.id,
              'justify-center': !isOpen,
              'justify-start space-x-3': isOpen
            }">

            <!-- Icons -->
            <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <!-- Dashboard -->
              <path *ngIf="item.icon === 'home'" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
              <!-- Users -->
              <path *ngIf="item.icon === 'users'" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197m13.5-9a2.5 2.5 0 11-5 0 2.5 2.5 0 015 0z" />
              <!-- Package -->
              <path *ngIf="item.icon === 'package'" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
              <!-- Shopping Cart -->
              <path *ngIf="item.icon === 'shopping-cart'" stroke-linecap="round" stroke-linejoin="round"
                stroke-width="2"
                d="M3 3h2l.4 2M7 13h10l4-8H5.4m1.6 8L6 6H4m3 7a1 1 0 100 2 1 1 0 000-2zm10 0a1 1 0 100 2 1 1 0 000-2z" />
              <!-- Bar Chart -->
              <path *ngIf="item.icon === 'bar-chart'" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
              <!-- Settings -->
              <path *ngIf="item.icon === 'settings'" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
            </svg>

            <span *ngIf="isOpen" class="truncate">{{ item.name }}</span>
          </button>
        </div>
      </nav>
    </div>

    <!-- User Profile & Logout -->
    <div class="p-4 border-t border-white/10" *ngIf="isOpen">
      <div class="flex items-center space-x-3 mb-3">
        <div class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center">
          <span class="text-white font-semibold">JD</span>
        </div>
        <div class="flex-1 min-w-0">
          <p class="text-slate-100 font-medium text-sm truncate">John Doe</p>
          <p class="text-slate-400 text-xs truncate">john@empresa.com</p>
        </div>
      </div>

      <button (click)="onLogout()"
        class="w-full flex items-center justify-center space-x-2 px-4 py-2.5 bg-white/10 hover:bg-white/15 text-slate-100 rounded-lg transition-colors duration-200 ring-1 ring-white/10">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
        </svg>
        <span class="text-sm font-medium">Cerrar Sesión</span>
      </button>
    </div>

    <!-- User Profile Collapsed -->
    <div class="p-3 border-t border-white/10" *ngIf="!isOpen">
      <div class="flex flex-col items-center space-y-3">
        <div class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center">
          <span class="text-white font-semibold text-sm">JD</span>
        </div>
        <button (click)="onLogout()"
          class="w-8 h-8 rounded-lg bg-white/10 hover:bg-white/15 flex items-center justify-center transition-colors duration-200"
          title="Cerrar Sesión">
          <svg class="w-4 h-4 text-slate-100" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
          </svg>
        </button>
      </div>
    </div>
  </div>
</div>
